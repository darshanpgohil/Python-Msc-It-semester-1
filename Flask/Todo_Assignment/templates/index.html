<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App Assignment</title>
</head>
<body>
    <h1>Mahadev Mahadev</h1>

    <form action="/add" method="post">
        <div>
            <label for="title">Title : </label>
            <input type="text" name="title" id="title">
        </div>
        <div>
            <label for="description">Description : </label>
            <input type="text" name="description" id="description">
        </div>
        <div>
            <select name="priority" id="priority">
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>
        </div>
        <div>
            <select name="is_complited" id="is_complited">
                <option value="True">Completed</option>
                <option value="False">Pending</option>
            </select>
        </div>
        <div>
            <label for="due_date">Due Date : </label>
            <input type="date" name="due_date" id="due_date">
        </div>
        <div>
            <button type="submit">Add Todo</button>
        </div>
    </form>
    <div>
        <form action="/get" method="get">
                <button type="submit">Show Todo</button>
        </form>
    </div>
    <div>
                <table>
                    <thead>
                        <tr>
                        <th>Id</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Priority</th>
                        <th>Is_Completed</th>
                        <th>Due_date</th>
                        <th>Edit</th>
                        <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for i in data %}
                        <tr>
                        <td>{{ i.id }}</td>
                        <td>{{ i.title }}</td>
                        <td>{{ i.description }}</td>
                        <td>{{ i.priority }}</td>
                        <td>{{ i.is_complited }}</td>
                        <td>{{ i.due_date.strftime('%d-%m-%Y') }}</td>
                        <td><a href="/toggle/{{ i.id }}">Toggle</a></td>
                        <td>
                            <form action="/edit" method="get">
                                <input type="hidden" name="e_id" id="e_id" value="{{ i.id }}">
                                <button type="submit">Edit Record</button>
                            </form>
                        </td>
                        <td>
                            <form action="/delete" method="POST">
                                <input type="hidden" name="d_id" id="d_id" value="{{ i.id }}">
                                <button type="submit">Delete</button>
                            </form>
                        </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
    </div>
</body>
</html>
